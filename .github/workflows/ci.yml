name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      # Только синтаксис и явные ошибки (неопределённые имена) — без стилевых правил
      - run: ruff check --select E9,F63,F7,F82 src scripts
      - run: python -m compileall -q src scripts
